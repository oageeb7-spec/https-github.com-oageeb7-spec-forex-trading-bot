# One-click hosting on Render (render.com → New → Blueprint → pick this repository).
# Secrets marked sync: false are entered in Render's dashboard, never stored in the repository.
services:
  - type: web
    name: os-ai
    runtime: node
    plan: starter # always on; the free plan sleeps when idle, which stops the agents and paper trading
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ENV
        value: practice
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: BUDGET
        value: 50
