[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forex-bot"
version = "0.1.0"
description = "Forex trading bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
forex-bot = "forex_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forex_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
