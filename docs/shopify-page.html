<!--
  OS AI dashboard page for the Shopify store.
  Shopify admin → Online Store → Pages → Add page → title "OS AI" → Show HTML (<>) → paste this.
  Replace https://YOUR-OS-AI-HOST with the address of your hosted OS AI (for example https://os-ai.onrender.com).
  Set the page's visibility to Hidden so it is not in your store navigation; open it at /pages/os-ai.
-->
<div style="margin:0 -20px;">
  <iframe
    src="https://YOUR-OS-AI-HOST/"
    title="OS AI trading dashboard"
    style="width:100%;height:85vh;min-height:640px;border:0;border-radius:6px;background:#07090c;"
    allow="fullscreen"
    loading="lazy"></iframe>
  <p style="text-align:center;font-size:13px;margin-top:8px;">
    If the dashboard asks for a password and nothing appears,
    <a href="https://YOUR-OS-AI-HOST/" target="_blank" rel="noopener">open OS AI in a new tab</a>.
  </p>
</div>
